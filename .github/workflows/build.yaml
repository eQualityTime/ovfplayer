# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build and Test

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
    branches-ignore:
      - 'gh-pages'

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [10.13.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: npm install
      run: npm ci
    - name: tslint
      run: npm run lint
    - name: build distribution
      run: npm run build --prod

    - name: Execute tests
      run: npm run ng test -- --watch=false --browsers=ChromeHeadless --code-coverage
    - name: Upload test results artifact
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: test-results/junit.xml
    - name: Upload code coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeCoverageResults
        path: coverage/

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2.4.1
      if: always()
      with:
        files: "test-results/junit.xml"
        
    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: 'coverage/cobertura-coverage.xml'
        badge: true
        fail_below_min: true
        format: 'markdown'
        output: 'both'
        thresholds: '60 80'
    - name: Write to Coverage to Job Summary
      run: |
        echo "### Code Coverage Results" > code-coverage-comment.md
        cat code-coverage-results.md >> code-coverage-comment.md
        cat code-coverage-comment.md >> $GITHUB_STEP_SUMMARY
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        header: 'coverage'
        path: 'code-coverage-comment.md'
    - id: coverage_extraction
      uses: QwerMike/xpath-action@v1
      with:
        filename: 'coverage/cobertura-coverage.xml'
        expression: '//coverage[1]@line-rate'
    - name: Code Coverage Check
      uses: LouisBrunner/checks-action@v2.0.0
      if: always()
      with:
        token: ${{ github.token }}
        name: Code Coverage
        conclusion: ${{ echo steps.coverage_extraction.outputs.result 0.8 | awk '$1 >= $2 {print "success"} $1 < $2 {print "failure"}' }}
        output: |
          {"summary":"Code coverage was ${{ steps.coverage_extraction.outputs.result }}%. Minimum required is 80%."}
        output_text_description_file: code-coverage-comment.md
    
