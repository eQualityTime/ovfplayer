@if (board) {
  <div class="board">
    @for (row of buttonProvider.getScannableCollections(); track row) {
      <div class="boardRow"
        [class.scanHighlight]="row.isHighlighted()"
        [class.scanSelect]="row.isSelection()"
        [style.height]="row.rowHeight">
        @for (butt of row.displayButtons; track butt) {
          <div class="boardButton"
            [class.scanHighlight]="butt && butt.isHighlighted()"
            [class.scanSelect]="butt && butt.isSelection()">
            @if (butt) {
              <app-obf-button [butt]="butt.button" [clickHandler]="handleButtonClick.bind(this)"></app-obf-button>
            }
          </div>
        }
      </div>
    }
  </div>
} @else {
  <app-progress></app-progress>
}
